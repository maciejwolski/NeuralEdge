[package]
name = "neuraledge-core"
version = "0.1.1"
edition = "2021"

[dependencies]
bytemuck = { version = "1.16.1", features = ["derive"] }
futures = "0.3.30"
futures-intrusive = "0.5.0"
ndarray = { version="0.15.6", features=["serde", "rayon"]}
num-traits = "0.2.18"
rand = "0.8.5"
rayon = "1.10.0"
serde = { version="1.0.199", features=["derive"] }
serde_json = "1.0.116"
tokio = { version="1.38.0", features = ["full"] }
tokio-macros = "2.3.0"
wgpu = "0.20.1"

